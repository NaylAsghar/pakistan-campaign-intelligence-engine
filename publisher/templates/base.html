<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Product Video Scheduler{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
  <link rel="stylesheet" href="/static/products.css">
</head>
<body>
  <nav>
    <a href="/">Product Video Scheduler</a>
    {% if request.session.get("user_id") %}
      <a href="/products">Products</a>
      <span class="nav-user">{{ request.session.get("email") }}</span>
      <form method="post" action="/logout" class="nav-form">
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="/login">Log in</a>
      <a href="/register">Register</a>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
